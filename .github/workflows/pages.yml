# Docs site on GitHub Pages: tests, build under /fizzy-ui/, deploy.
name: Docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:cli
      - run: npx ng build --base-href /fizzy-ui/
      # Every page is prerendered; an unknown URL gets 404.html, the client-rendered app, which redirects it.
      - run: cp dist/fizzy-ui/browser/index.csr.html dist/fizzy-ui/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/fizzy-ui/browser
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
