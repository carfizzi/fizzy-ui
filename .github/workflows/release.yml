# Stages the CLI on npm when a tag v<version> is pushed; a maintainer approves it on npmjs.com (2FA).
# No token: npm trusted publishing (OIDC), configured on npmjs.com for this repo and this file name.
# Provenance is added automatically. Trusted publishers allow only `npm stage publish` by default.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm run test:cli
      - name: Tag matches cli/package.json
        run: test "v$(node -p "require('./cli/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm --version
      - run: npm stage publish
        working-directory: cli
