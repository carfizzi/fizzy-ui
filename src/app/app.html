<a href="#main" (click)="$event.preventDefault(); main.focus()" class="sr-only z-50 rounded-md bg-background px-3 py-2 focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:ring-2 focus:ring-ring">Skip to content</a>

<header class="sticky top-0 z-40 border-b bg-background/95 backdrop-blur">
  <div class="mx-auto flex h-14 max-w-6xl items-center gap-2 px-4">
    <button fzButton variant="ghost" size="sm" class="md:hidden" (click)="mobileNav.open()" aria-label="Open navigation">
      <svg aria-hidden="true" viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
    </button>
    <a routerLink="/" class="font-semibold tracking-tight">fizzy-ui</a>
    <button fzButton variant="outline" size="sm" class="ml-auto gap-2 text-muted-foreground" aria-keyshortcuts="Meta+K Control+K" (click)="openSearch()">
      <svg aria-hidden="true" viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
      Search
      <kbd class="hidden rounded-sm border bg-muted px-1.5 font-sans text-xs sm:inline" aria-hidden="true">⌘K</kbd>
    </button>
    <button fzButton variant="ghost" size="sm" class="aria-pressed:bg-accent" [attr.aria-pressed]="dark()" (click)="toggleDark()">Dark mode</button>
  </div>
</header>

<div class="mx-auto flex max-w-6xl">
  <nav aria-label="Documentation" class="sticky top-14 hidden h-[calc(100dvh-3.5rem)] w-56 shrink-0 overflow-y-auto border-r p-4 md:block">
    <ng-container *ngTemplateOutlet="links" />
  </nav>
  <main #main id="main" tabindex="-1" class="min-w-0 flex-1 px-4 py-8 outline-none md:px-10">
    <router-outlet />
  </main>
</div>

<ng-template #links>
  <div class="flex flex-col gap-6 text-sm">
    <div class="flex flex-col gap-1">
      <h2 class="px-2 text-xs font-semibold uppercase tracking-wide text-muted-foreground">Getting started</h2>
      @for (g of guides; track g.path) {
        <a [routerLink]="g.path" routerLinkActive="bg-accent font-medium text-accent-foreground" ariaCurrentWhenActive="page" class="rounded-md px-2 py-1.5 hover:bg-accent/60">{{ g.title }}</a>
      }
    </div>
    <div class="flex flex-col gap-1">
      <h2 class="px-2 text-xs font-semibold uppercase tracking-wide text-muted-foreground">Components</h2>
      @for (d of docs; track d.name) {
        <a [routerLink]="['/components', d.name]" routerLinkActive="bg-accent font-medium text-accent-foreground" ariaCurrentWhenActive="page" class="rounded-md px-2 py-1.5 hover:bg-accent/60">{{ d.title }}</a>
      }
    </div>
  </div>
</ng-template>

<ng-template fzDialog side="left" #mobileNav="fzDialog">
  <h2 fzDialogTitle class="sr-only">Navigation</h2>
  <nav aria-label="Documentation" class="-mx-2 overflow-y-auto" (click)="closeOnLink($event, mobileNav)">
    <ng-container *ngTemplateOutlet="links" />
  </nav>
</ng-template>

<ng-template fzDialog #search="fzDialog">
  <h2 fzDialogTitle class="sr-only">Search documentation</h2>
  <fz-command label="Search components and guides" placeholder="Search components and guides…" (itemSelected)="go($any($event))">
    <fz-command-group heading="Getting started">
      @for (g of guides; track g.path) {
        <fz-command-item [value]="g.path" [label]="g.title" />
      }
    </fz-command-group>
    <fz-command-group heading="Components">
      @for (d of docs; track d.name) {
        <fz-command-item [value]="'/components/' + d.name" [label]="d.title" [keywords]="[d.name, d.description]" />
      }
    </fz-command-group>
  </fz-command>
</ng-template>
